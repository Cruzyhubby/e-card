# Render Blueprint — free plan.
# Dashboard: New > Blueprint > pick this repository > Apply.
# Only DB_PASSWORD needs to be pasted (Supabase -> Settings > Database).
services:
  - type: web
    name: eclat
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Must match backend/.env: existing app_settings are encrypted with it.
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Lagos
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-eu-central-2.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.pjqtgieasmcvkcnnlpch
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      # Bearer tokens expire after 24 hours.
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "1440"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: hello@eclat.app
      - key: ECLAT_MESSAGING_DRIVER
        value: log
      - key: SMS_PROVIDER
        value: kilakona
      - key: KILAKONA_BASE_URL
        value: https://messaging.kilakona.co.tz
      - key: KILAKONA_SEND_PATH
        value: /api/v1/vendor/message/send
